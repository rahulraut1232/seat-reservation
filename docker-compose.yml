services:

  postgres:
    image: postgres:17
    container_name: seat-reservation-postgres
    environment:
      POSTGRES_DB: seat_reservation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seat_reservation"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  seat-reservation-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seat-reservation-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/seat_reservation
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JAVA_TOOL_OPTIONS: "-Duser.timezone=UTC"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data: