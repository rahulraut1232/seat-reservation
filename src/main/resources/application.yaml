spring:
  application:
    name: seat-reservation-service
  datasource:
    url: jdbc:postgresql://localhost:5432/seat_reservation
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update  # final submission ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus

  endpoint:
    health:
      probes:
        enabled: true

  metrics:
    tags:
      application: seat-reservation

server:
  port: 8080