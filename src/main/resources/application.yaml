spring:
  application:
    name: seat-reservation-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/seat_reservation}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

#    url: jdbc:postgresql://localhost:5432/seat_reservation
#    username: postgres
#    password: postgres
#    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate  # final submission ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId}] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus

  endpoint:
    health:
      probes:
        enabled: true

  metrics:
    tags:
      application: seat-reservation

server:
  port: ${PORT:8080}